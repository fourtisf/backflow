# Nginx sample for the VPS (SPEC §12). TLS via Let's Encrypt (certbot --nginx).
#   /        -> web (Next.js, :3000)
#   /api/    -> api (Fastify, :4000), prefix stripped
#   /live    -> api WebSocket
# Build the web app with NEXT_PUBLIC_API_URL=/api and NEXT_PUBLIC_WS_URL=wss://backflow.example/live

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name backflow.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name backflow.example;

  ssl_certificate     /etc/letsencrypt/live/backflow.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/backflow.example/privkey.pem;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  client_max_body_size 5m;   # 4 MB image limit plus form fields

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /live {
    proxy_pass http://127.0.0.1:4000/live;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
