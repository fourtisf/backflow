# Nginx for rebuy.fun (generated from backflow.conf; same rules). TLS: certbot certonly, see docs/DEPLOY.md "Demo deploy".
#   /                     -> web (Next.js, 127.0.0.1:3000)
#   /api/                 -> api (Fastify, 127.0.0.1:4000), prefix stripped
#   /api/launch/metadata  -> api, image uploads (own rate limit and body size)
#   /live                 -> api WebSocket
#   /api/media/<sha256>   -> coin images and metadata straight from /var/lib/rebuy/media (D-048)
#   www.rebuy.fun         -> 301 to https://rebuy.fun (one origin: CORS, CSP and the RPC URL all expect it)
# Build the web app with NEXT_PUBLIC_API_URL=/api and NEXT_PUBLIC_WS_URL=wss://rebuy.fun/live
#
# Client addresses (audit H2): every proxied location OVERWRITES X-Forwarded-For with $remote_addr.
# Never use $proxy_add_x_forwarded_for here: it appends to whatever the client sent, and the API would
# then rate-limit on an address the client chose. The API trusts X-Forwarded-For only from 127.0.0.1
# (TRUST_PROXY) and groups IPv6 clients by /64; the limits below are per address.

limit_req_zone  $binary_remote_addr zone=api:10m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=upload:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=live:10m   rate=30r/m;   # new WebSocket handshakes
limit_req_zone  $binary_remote_addr zone=media:10m  rate=60r/s;   # coin images: a board shows many at once
limit_conn_zone $binary_remote_addr zone=live_conn:10m;
limit_req_status  429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name rebuy.fun www.rebuy.fun;
  return 301 https://rebuy.fun$request_uri;
}

# www is only a redirect, so the site has one origin (audit)
server {
  listen 443 ssl http2;
  server_name www.rebuy.fun;
  ssl_certificate     /etc/letsencrypt/live/rebuy.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rebuy.fun/privkey.pem;
  return 301 https://rebuy.fun$request_uri;
}

server {
  listen 443 ssl http2;
  server_name rebuy.fun;

  ssl_certificate     /etc/letsencrypt/live/rebuy.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rebuy.fun/privkey.pem;

  # No add_header inside the locations below, or these would be dropped there.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  client_max_body_size 64k;   # JSON bodies; the API's own limit is 64 KB

  # Image + metadata upload: 4 MB image plus form fields, 10 per minute per address (the API adds
  # 10 per hour per address and per wallet, and needs a signed launch session).
  location = /api/launch/metadata {
    limit_req zone=upload burst=5 nodelay;
    client_max_body_size 5m;
    proxy_pass http://127.0.0.1:4000/launch/metadata;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Coin images and metadata (D-048), served from disk with their own looser limit. Names are SHA-256 of the
  # content, so they never change. add_header here drops the server-level ones, so they are repeated.
  location ~ "^/api/media/([0-9a-f]{64}\.(png|jpg|gif|webp|json))$" {
    limit_req zone=media burst=200 nodelay;
    alias /var/lib/rebuy/media/$1;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket: at most 20 open connections and 30 new ones a minute per address (the API also caps
  # per client and in total, WS_MAX_PER_IP / WS_MAX_CONNECTIONS).
  location = /live {
    limit_conn live_conn 20;
    limit_req zone=live burst=20 nodelay;
    proxy_pass http://127.0.0.1:4000/live;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
